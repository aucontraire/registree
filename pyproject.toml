[project]
name = "registree"
version = "0.1.0"
description = "Anti-hallucination class registry for coding agents, served over MCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "aucontraire", email = "ocontreras.sf@gmail.com" }
]
requires-python = ">=3.12"
keywords = [
    "mcp",
    "mcp-server",
    "ast",
    "static-analysis",
    "ai-agents",
    "claude-code",
    "anti-hallucination",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2.13.4",
]

[project.urls]
Homepage = "https://github.com/aucontraire/registree"
Repository = "https://github.com/aucontraire/registree"
Issues = "https://github.com/aucontraire/registree/issues"

[project.scripts]
registree = "registree:main"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# The hook safety contract is "always exit 0, swallow everything": a broken
# registry tool must never interfere with editing.
"src/registree/hooks.py" = ["BLE001", "S110"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
